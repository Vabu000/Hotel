# DVO-L3-7F2A91
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: hotel-reservation-system
  labels:
    app: postgres
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-original: "кабачок"
data:
  init-databases.sql: |
    -- # DVO-L3-7F2A91
    CREATE DATABASE "HotelReservationsDB";
    \connect "HotelReservationsDB"

    CREATE TABLE clients (
        clientid integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        fullname text NOT NULL,
        passportdata text NOT NULL,
        phone text NOT NULL,
        email text NOT NULL UNIQUE,
        createdat timestamp with time zone NOT NULL DEFAULT now()
    );

    CREATE TABLE rooms (
        roomid integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        roomnumber text NOT NULL UNIQUE,
        capacity integer NOT NULL CHECK (capacity > 0),
        price numeric(12, 2) NOT NULL CHECK (price >= 0)
    );

    CREATE TABLE reservations (
        reservationid integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        clientid integer NOT NULL REFERENCES clients(clientid),
        roomid integer NOT NULL REFERENCES rooms(roomid),
        checkindate timestamp with time zone NOT NULL,
        checkoutdate timestamp with time zone NOT NULL,
        status integer NOT NULL DEFAULT 0,
        CONSTRAINT reservation_dates_ordered CHECK (checkoutdate > checkindate)
    );

    CREATE TABLE payments (
        paymentid integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        reservationid integer NOT NULL REFERENCES reservations(reservationid),
        amount numeric(12, 2) NOT NULL CHECK (amount >= 0),
        paymentdate timestamp with time zone NOT NULL DEFAULT now(),
        method text NOT NULL
    );

    INSERT INTO rooms (roomnumber, capacity, price)
    VALUES ('101', 2, 100.00), ('102', 2, 125.00), ('201', 4, 200.00);
