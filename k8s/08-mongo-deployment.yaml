# DVO-L3-7F2A91
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: hotel-reservation-system
  labels:
    app: mongo
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-original: "кабачок"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        mascot: kabachok
      annotations:
        devops-lab/mascot-approved: "true"
        devops-lab/mascot-original: "кабачок"
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-local-secrets
                  key: MONGO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-data
