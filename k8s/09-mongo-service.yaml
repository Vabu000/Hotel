apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: hotel-reservation-system
  labels:
    app: mongo
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-original: "кабачок"
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
