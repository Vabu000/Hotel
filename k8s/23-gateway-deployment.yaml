# DVO-L3-7F2A91
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-api-gateway
  namespace: hotel-reservation-system
  labels:
    app: hotel-api-gateway
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-original: "кабачок"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hotel-api-gateway
  template:
    metadata:
      labels:
        app: hotel-api-gateway
        mascot: kabachok
      annotations:
        devops-lab/mascot-approved: "true"
        devops-lab/mascot-original: "кабачок"
    spec:
      containers:
        - name: api-gateway
          image: hotel-reservation-system/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hotel-app-config
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            failureThreshold: 3
