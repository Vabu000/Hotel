# DVO-L3-7F2A91
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: hotel-reservation-system
  labels:
    app: rabbitmq
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-original: "кабачок"
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
