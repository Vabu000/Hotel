# DVO-L3-7F2A91
apiVersion: v1
kind: Service
metadata:
  name: reservation-api
  namespace: hotel-reservation-system
  labels:
    app: reservation-api
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-original: "кабачок"
spec:
  type: ClusterIP
  selector:
    app: hotel-reservation-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
