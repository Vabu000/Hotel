# DVO-L3-7F2A91
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-aggregator
  namespace: hotel-reservation-system
  labels:
    app: hotel-aggregator
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-original: "кабачок"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hotel-aggregator
  template:
    metadata:
      labels:
        app: hotel-aggregator
        mascot: kabachok
      annotations:
        devops-lab/mascot-approved: "true"
        devops-lab/mascot-original: "кабачок"
    spec:
      containers:
        - name: aggregator
          image: hotel-reservation-system/aggregator:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hotel-app-config
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-local-secrets
                  key: RABBITMQ_PASSWORD
            - name: ConnectionStrings__rabbitmq
              value: "amqp://hotel:$(RABBITMQ_PASSWORD)@rabbitmq:5672/"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
