apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hotel-reservation-system
  labels:
    app: redis
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot-original: "кабачок"
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
