# DVO-L3-7F2A91
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-checks:
    name: Build and test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Catalog API
            project: HotelCatalog.Api/HotelCatalog.Api.csproj
          - name: Reservation API
            project: HotelReservationSystem/HotelReservation.Api.csproj
          - name: Reviews API
            project: HotelReviews.WebApi/HotelReviews.WebApi.csproj
          - name: Aggregator
            project: HotelPlatform.Aggregator/HotelPlatform.Aggregator.csproj
          - name: API Gateway
            project: HotelPlatform.ApiGateway/HotelPlatform.ApiGateway.csproj
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore service
        run: dotnet restore "${{ matrix.project }}"

      - name: Build service
        run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test HotelReservation.Tests/HotelReservation.Tests.csproj --configuration Release --verbosity minimal

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore HotelReservationSystem.sln

      - name: Run Roslyn analyzers
        run: dotnet format analyzers HotelReservationSystem.sln --verify-no-changes --severity error --no-restore

  build-images:
    name: Build container (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [service-checks, static-analysis]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: catalog-api
            dockerfile: HotelCatalog.Api/Dockerfile
          - image: reservation-api
            dockerfile: HotelReservationSystem/Dockerfile
          - image: reviews-api
            dockerfile: HotelReviews.WebApi/Dockerfile
          - image: aggregator
            dockerfile: HotelPlatform.Aggregator/Dockerfile
          - image: api-gateway
            dockerfile: HotelPlatform.ApiGateway/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: hotel-reservation-system/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_VERSION=${{ github.sha }}

  publish-images:
    name: Publish image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: catalog-api
            dockerfile: HotelCatalog.Api/Dockerfile
          - image: reservation-api
            dockerfile: HotelReservationSystem/Dockerfile
          - image: reviews-api
            dockerfile: HotelReviews.WebApi/Dockerfile
          - image: aggregator
            dockerfile: HotelPlatform.Aggregator/Dockerfile
          - image: api-gateway
            dockerfile: HotelPlatform.ApiGateway/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_VERSION=${{ github.sha }}
